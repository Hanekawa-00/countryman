name: Build Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :broker:assembleDebug

      - name: Rename APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/countryman-app-debug.apk
          cp broker/build/outputs/apk/debug/broker-debug.apk artifacts/countryman-broker-debug.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: countryman-debug-apks
          path: artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*.apk
